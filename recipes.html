<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipes & Exercises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f141b; --bg-elevated:#171e28; --bg-card:#1b232e; --line: rgba(255,255,255,0.08);
    --gold:#e3a73b; --gold-dim: rgba(227,167,59,0.15);
    --teal:#2f9077; --teal-dim: rgba(47,144,119,0.15);
    --text:#f3eee4; --muted:#8b96a3; --muted-2:#5c6673;
  }
  html[data-theme="light"]{
    --bg:#f7f3ea; --bg-elevated:#ffffff; --bg-card:#ffffff; --line: rgba(20,20,20,0.09);
    --gold:#b9761f; --gold-dim: rgba(185,118,31,0.12);
    --teal:#1f7a63; --teal-dim: rgba(31,122,99,0.12);
    --text:#221c14; --muted:#6a6357; --muted-2:#9b9385;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(227,167,59,0.08), transparent), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; min-height:100vh; padding:20px 16px 60px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto;}
  h1{font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; margin-bottom:2px;}
  .headrow{display:flex; justify-content:space-between; align-items:center;}
  .themebtn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg-card);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .sub{color:var(--muted); font-size:13px; margin-bottom:18px;}

  .pagenav{display:flex; gap:8px; margin-bottom:20px;}
  .navlink{
    flex:1; text-align:center; padding:9px 4px; border-radius:8px; text-decoration:none;
    font-family:'Oswald',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    background:var(--bg-card); color:var(--muted); border:1px solid var(--line);
  }
  .navlink.active{background:var(--gold-dim); color:var(--gold); border-color:rgba(227,167,59,0.4);}

  .maintabs{display:flex; gap:8px; margin-bottom:18px;}
  .maintab{
    flex:1; padding:11px 4px; text-align:center; border-radius:10px; cursor:pointer; user-select:none;
    font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.05em; text-transform:uppercase;
    background:var(--bg-card); border:1px solid var(--line); color:var(--muted);
  }
  .maintab.active{background:var(--teal-dim); color:var(--teal); border-color:rgba(47,144,119,0.4);}

  .view{display:none;} .view.active{display:block;}

  /* diet subtabs */
  .subtabs{display:flex; gap:6px; margin-bottom:16px;}
  .subtab{
    padding:7px 14px; border-radius:20px; font-size:12.5px; font-family:'Inter',sans-serif; font-weight:600;
    background:var(--bg-card); border:1px solid var(--line); color:var(--muted); cursor:pointer;
  }
  .subtab.active{background:var(--gold-dim); color:var(--gold); border-color:rgba(227,167,59,0.4);}

  .recipe-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden;
  }
  .recipe-head{padding:15px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .recipe-name{font-family:'Oswald',sans-serif; font-size:16px; font-weight:600;}
  .recipe-badges{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .badge{font-family:'IBM Plex Mono',monospace; font-size:11px; padding:3px 8px; border-radius:5px; background:var(--bg-elevated); color:var(--muted);}
  .badge.kcal{color:var(--gold);}
  .badge.protein{color:var(--teal);}
  .chev{color:var(--muted-2); font-size:18px; transition:transform 0.2s;}
  .recipe-card.open .chev{transform:rotate(180deg);}
  .recipe-body{max-height:0; overflow:hidden; transition:max-height 0.25s ease; padding:0 16px;}
  .recipe-card.open .recipe-body{max-height:600px; padding:0 16px 16px;}
  .recipe-body h4{font-family:'Oswald',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted-2); margin:10px 0 6px;}
  .recipe-body ul{padding-left:18px; font-size:13px; color:#cdd3da; line-height:1.6;}
  .recipe-body p{font-size:13px; color:#cdd3da; line-height:1.6;}
  .macros{display:flex; gap:14px; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted);}

  /* exercises */
  .daytoggle{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .daytoggle .subtab{flex:1 1 calc(25% - 5px);}
  .ex-day-heading{font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold); margin:4px 0 14px;}
  .exercise-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;
  }
  .ex-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .ex-name{font-family:'Oswald',sans-serif; font-size:15px; font-weight:600;}
  .ex-target{font-size:11px; color:var(--muted-2); font-family:'IBM Plex Mono',monospace;}
  .ex-cue{font-size:12.5px; color:var(--muted); margin:6px 0 12px; line-height:1.5;}
  .sets-row{display:flex; gap:8px; align-items:center;}
  .set-circle{
    width:34px; height:34px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); cursor:pointer; transition:all 0.15s; flex-shrink:0;
  }
  .set-circle.filled{background:var(--teal); border-color:var(--teal); color:#08150f; font-weight:600;}
  .timer-btn{
    margin-left:auto; background:var(--gold-dim); color:var(--gold); border:1px solid rgba(227,167,59,0.4);
    border-radius:8px; padding:8px 12px; font-family:'Oswald',sans-serif; font-size:11.5px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.03em; cursor:pointer; white-space:nowrap;
  }
  .timer-btn.running{background:var(--gold); color:#1a1204;}
  .progress-bar{height:5px; background:var(--bg-elevated); border-radius:3px; margin-top:12px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--teal); width:0%; transition:width 0.2s;}

  .session-summary{
    background:var(--bg-card); border:1px solid rgba(47,144,119,0.4); border-radius:14px; padding:16px; margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .session-summary .num{font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; color:var(--teal);}
  .session-summary .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;}
  .resetall{background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:8px 12px; font-size:11.5px; cursor:pointer; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em;}

  footer{text-align:center; color:var(--muted-2); font-size:11px; margin-top:34px;}

  .target-banner{display:flex; justify-content:space-between; background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:14px 8px; margin-bottom:18px;}
  .target-banner .tb-item{text-align:center; flex:1;}
  .target-banner .tb-num{display:block; font-family:'Oswald',sans-serif; font-size:18px; font-weight:700; color:var(--gold);}
  .target-banner .tb-lbl{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="headrow">
    <h1>Recipes &amp; Exercises</h1>
    <button class="themebtn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
  <div class="sub">Tap a recipe to expand · tap circles to log sets</div>

  <div class="target-banner" id="targetBanner"></div>

  <nav class="pagenav">
    <a href="index.html" class="navlink">Today</a>
    <a href="recipes.html" class="navlink active">Recipes &amp; Exercises</a>
  </nav>

  <div class="maintabs">
    <div class="maintab active" data-view="diet">Diet</div>
    <div class="maintab" data-view="exercise">Exercises</div>
  </div>

  <!-- DIET VIEW -->
  <div class="view active" id="view-diet">
    <div class="subtabs" id="subtabs"></div>
    <div id="recipeList"></div>
  </div>

  <!-- EXERCISE VIEW -->
  <div class="view" id="view-exercise">
    <div class="session-summary">
      <div><div class="num" id="setsDone">0</div><div class="lbl">Sets logged today</div></div>
      <button class="resetall" onclick="resetAllSets()">Reset</button>
    </div>

    <div class="daytoggle" id="daytoggle"></div>
    <h2 class="ex-day-heading" id="exerciseHeading"></h2>
    <div id="exerciseList"></div>
  </div>

  <footer>Numbers are estimates for planning — actual values vary by brand/portion.</footer>
</div>

<script>
/* ---------------- DATA ---------------- */
const DAILY_TARGET = { kcal:1600, protein:160, carbs:60, fat:80 };

const RECIPES = {
  lunch: [
    { name:'Kashmiri Chicken Curry (No Rice)', kcal:700, protein:70, carbs:22, fat:42,
      ing:['Chicken thigh, skinless — 250g, cubed','Onion — 1 medium, chopped','Tomato — 2 medium, pureed','Ginger-garlic paste — 1 tbsp','Curd — 3 tbsp','Turmeric, chili powder, fennel powder, garam masala, salt','Mustard oil — 2 tsp','Haak (collard greens) or spinach — 1.5 cups, side','Cucumber-tomato salad'],
      method:'Sauté onion in mustard oil till golden. Add ginger-garlic paste, cook 1 min. Add tomato puree + spices, cook till oil separates. Add chicken, cover, cook 12-15 min till done. Stir in curd off heat. Sauté haak separately with a pinch of oil. Serve curry + haak + salad — skip rice/roti.' },
    { name:'Kashmiri Egg Curry (No Rice)', kcal:560, protein:34, carbs:20, fat:38,
      ing:['Eggs — 4, boiled and halved','Onion-tomato-curd gravy base (as above, no chicken)','Spinach or haak — 1.5 cups, sautéed','Plain curd — small bowl'],
      method:'Make the onion-tomato gravy base in mustard oil. Simmer boiled eggs in it 5 min to soak up flavor. Serve with sautéed spinach and a small bowl of curd on the side — skip rice/roti.' },
    { name:'Tandoori / Grilled Chicken Breast', kcal:620, protein:72, carbs:14, fat:26,

    { name:'Paneer & Vegetable Bhurji', kcal:610, protein:34, carbs:20, fat:42,
      ing:['Paneer — 150g, crumbled','Onion, tomato, capsicum — chopped, 1.5 cups total','Turmeric, chili powder, cumin, salt','Oil — 1 tsp'],
      method:'Sauté onion till soft, add capsicum and tomato, cook till just tender. Add crumbled paneer and spices, mix 3-4 min till warmed through. Serve with salad.' },
    { name:'Rajma (Small Portion) + Eggs — Occasional Carb Day', kcal:480, protein:33, carbs:38, fat:20,
      ing:['Rajma (kidney beans), cooked — ½ cup','Boiled eggs — 2','Onion-tomato masala','Salad, curd'],
      method:'Cook rajma in a light onion-tomato masala. Serve with 2 boiled eggs, salad, and curd on the side. This is your highest-carb lunch option — use it once a week, not daily.' },
    { name:'Quick Egg & Veggie Salad Bowl (No-Cook)', kcal:400, protein:27, carbs:13, fat:27,
      ing:['Eggs — 4, boiled','Cucumber — 1, chopped','Tomato — 1, chopped','Onion — a few slices','Mustard or olive oil — 1 tsp','Lemon juice, salt, pepper'],
      method:'Boil eggs ahead of time (batch-boil a dozen on Sunday). Chop everything, toss with oil, lemon, salt and pepper. Zero stovetop cooking needed on the day — 5 minutes, done.' },
    { name:'5-Ingredient Chicken Salad', kcal:390, protein:58, carbs:9, fat:13,
      ing:['Cooked chicken breast — 180g, shredded (batch-grill ahead)','Cucumber — 1, chopped','Tomato — 1, chopped','Curd — 2 tbsp','Olive oil — 1 tsp, salt, pepper'],
      method:'Use chicken grilled/boiled in advance. Toss shredded chicken with chopped veg, curd, oil, salt and pepper. No cooking required if chicken is meal-prepped — your fastest high-protein lunch.' }
  ],
  snack: [
    { name:'Whey Protein Shake', kcal:150, protein:25, carbs:5, fat:3,
      ing:['Whey protein — 1 scoop (30g)','Water or a splash of milk'], method:'Shake or blend with water/milk. Quickest, cheapest protein top-up of the day.' },
    { name:'2 Boiled Eggs', kcal:156, protein:13, carbs:1, fat:11,
      ing:['Eggs — 2, boiled'], method:'Boil for 9-10 min, peel, sprinkle salt & pepper.' },
    { name:'Grilled Paneer Cubes', kcal:200, protein:14, carbs:1, fat:16,
      ing:['Paneer — 75g, cubed','Chaat masala, lemon, pinch of salt'], method:'Pan-sear on a dry non-stick pan 2-3 min per side. Squeeze lemon, dust chaat masala.' },
    { name:'Plain Curd + Almonds', kcal:210, protein:8, carbs:10, fat:14,
      ing:['Plain unsweetened curd — 150g','Almonds — 10'], method:'Eat curd as-is, no sugar added. Almonds on the side.' },
    { name:'Roasted Chana (Occasional)', kcal:95, protein:5, carbs:15, fat:2,
      ing:['Roasted chickpeas — 25g, no oil'], method:'Save for gym-heavy days since it runs higher carb than your other snack options.' },
    { name:'Cucumber-Curd Raita', kcal:105, protein:6, carbs:11, fat:5,
      ing:['Cucumber — 1, grated','Plain curd — 150g','Roasted cumin powder, salt'], method:'Grate cucumber, squeeze out excess water, mix into curd with cumin and salt. No cooking at all.' },
    { name:'Roasted Peanuts (Unsalted)', kcal:115, protein:5, carbs:3, fat:10,
      ing:['Roasted peanuts — 20g (small handful), unsalted'], method:'Zero prep — keep a jar at your desk for the 4pm slot.' }
  ],
  dinner: [
    { name:'Egg Bhurji + Paneer + Sautéed Greens', kcal:600, protein:40, carbs:17, fat:42,
      ing:['Eggs — 4','Paneer — 50g, crumbled','Onion, tomato, green chili — chopped','Mustard oil — 1.5 tsp','Spinach or lauki — 1.5 cups, sautéed'],
      method:'Sauté onion till soft, add tomato + chili, cook till mushy. Crack in eggs and crumbled paneer, scramble till just set. Serve with sautéed greens — no roti.' },
    { name:'Tandoori Chicken + Sautéed Vegetables', kcal:450, protein:65, carbs:10, fat:14,
      ing:['Chicken breast — 200g, curd-marinated','Mixed vegetables — 1.5 cups','Garlic, black pepper, salt','Oil — 1 tsp'],
      method:'Grill or pan-sear marinated chicken till cooked through. Stir-fry vegetables separately. Serve together — light and high-protein.' },
    { name:'Clear Chicken Soup', kcal:320, protein:48, carbs:8, fat:8,
      ing:['Chicken, bone-in, skinless — 250g','Garlic, ginger, black pepper, bay leaf','Carrot, beans, spinach','Water — 2-3 cups, salt'],
      method:'Simmer chicken with aromatics 25-30 min till tender. Add vegetables in the last 10 min. Light, easy to digest before bed.' },
    { name:'Grilled Fish + Sautéed Spinach', kcal:400, protein:55, carbs:6, fat:16,
      ing:['Firm white fish (rohu/basa) — 200g','Garlic, lemon, black pepper','Spinach — 1.5 cups, sautéed','Oil — 1 tsp'],
      method:'Marinate fish briefly in lemon, garlic, pepper. Pan-sear or grill 3-4 min per side. Serve over sautéed spinach — good rotation for variety and cholesterol.' },
    { name:'Paneer Tikka + Roasted Vegetables', kcal:430, protein:26, carbs:12, fat:32,
      ing:['Paneer — 120g, cubed','Curd, ginger-garlic, tikka masala spices','Mixed vegetables — 1.5 cups, roasted'],
      method:'Marinate paneer in spiced curd 15-20 min. Grill or pan-sear till lightly charred. Roast vegetables alongside. Vegetarian dinner option.' },
    { name:'Simple Boiled Egg & Vegetable Plate (No-Cook)', kcal:400, protein:28, carbs:14, fat:27,
      ing:['Eggs — 4, boiled','Cucumber — 2, sliced','Tomato — 1, sliced','Olive oil — 1 tsp, salt, pepper, chaat masala'],
      method:'Boil eggs ahead of time. Slice veg, arrange on a plate, drizzle oil and seasoning. No stove needed on a tired evening.' },
    { name:'Quick Paneer & Cucumber Bowl', kcal:305, protein:20, carbs:8, fat:22,
      ing:['Paneer — 100g, cubed','Cucumber — 1.5, chopped','Curd — 2 tbsp','Chaat masala, lemon'],
      method:'Pan-sear paneer 2-3 min on a dry non-stick pan (no oil needed). Toss with cucumber, curd, chaat masala and a squeeze of lemon. Under 10 minutes.' }
  ]
};

const EXERCISES = {
  mon: { label:'Mon · Full Body A', list:[
    { name:'Goblet Squat', target:'3 × 12', cue:'Hold a dumbbell at chest height, squat till thighs are near parallel, drive up through your heels.', sets:3, timed:false },
    { name:'Incline Push-up / Chest Press Machine', target:'3 × 10-12', cue:'Hands slightly wider than shoulders. Control the lowering phase — 2 sec down.', sets:3, timed:false },
    { name:'Lat Pulldown', target:'3 × 12', cue:'Pull the bar to your upper chest, squeeze shoulder blades together, don\'t lean back.', sets:3, timed:false },
    { name:'Plank Hold', target:'3 × 40 sec', cue:'Straight line head to heels, brace your core, don\'t let hips sag.', sets:3, timed:true, seconds:40 },
    { name:'Incline Treadmill Walk (Finisher)', target:'15 min', cue:'Moderate incline, brisk pace — caps off the session.', sets:1, timed:true, seconds:900 }
  ]},
  tue: { label:'Tue · Cardio + Core', list:[
    { name:'Brisk Walk / Cycling', target:'30-35 min', cue:'Talk-test pace — you should be able to speak in short sentences, not sing.', sets:1, timed:true, seconds:1800 },
    { name:'Bicycle Crunches', target:'3 × 20', cue:'Slow and controlled, elbow to opposite knee — don\'t yank your neck.', sets:3, timed:false },
    { name:'Dead Bug', target:'3 × 12 per side', cue:'Lower back stays pressed to the floor the whole time.', sets:3, timed:false },
    { name:'Side Plank', target:'3 × 25 sec/side', cue:'Stack hips and shoulders, don\'t let hips drop.', sets:3, timed:true, seconds:25 }
  ]},
  wed: { label:'Wed · Full Body B', list:[
    { name:'Leg Press / Step-ups', target:'3 × 12', cue:'Full range of motion, don\'t lock knees out hard at the top.', sets:3, timed:false },
    { name:'Seated Cable Row', target:'3 × 12', cue:'Pull to your torso, squeeze shoulder blades, keep your back straight.', sets:3, timed:false },
    { name:'Dumbbell Shoulder Press', target:'3 × 10', cue:'Press straight up, avoid arching your lower back.', sets:3, timed:false },
    { name:'Standing Calf Raise', target:'3 × 15', cue:'Full stretch at the bottom, pause at the top.', sets:3, timed:false },
    { name:'Incline Treadmill Walk (Finisher)', target:'15 min', cue:'Moderate incline, brisk pace.', sets:1, timed:true, seconds:900 }
  ]},
  thu: { label:'Thu · Active Recovery', list:[
    { name:'Easy Walk', target:'30-40 min', cue:'Easy conversational pace — this is recovery, not a workout.', sets:1, timed:true, seconds:1800 },
    { name:'Cat-Cow Stretch', target:'10 reps', cue:'Slow, controlled — sync with breath.', sets:1, timed:false },
    { name:'Hip Opener (90/90)', target:'45 sec/side', cue:'Sit tall, gently lean forward over the front shin.', sets:2, timed:true, seconds:45 },
    { name:'Standing Hamstring Stretch', target:'30 sec/side', cue:'Soft knee, hinge at the hips not the back.', sets:2, timed:true, seconds:30 }
  ]},
  fri: { label:'Fri · Full Body C', list:[
    { name:'Romanian Deadlift (Light, Form Focus)', target:'3 × 10', cue:'Hinge at the hips, dumbbells stay close to your legs, keep your back flat.', sets:3, timed:false },
    { name:'Incline Dumbbell / Machine Press', target:'3 × 12', cue:'Control the weight down, press up without locking elbows hard.', sets:3, timed:false },
    { name:'Assisted Pull-up / Lat Pulldown', target:'3 × 12', cue:'Full stretch at the top, pull elbows down and back.', sets:3, timed:false },
    { name:'Farmer\'s Carry', target:'3 × 30m', cue:'Heavy dumbbells, walk tall, shoulders back — grip and core work hard here.', sets:3, timed:false },
    { name:'Incline Treadmill Walk (Finisher)', target:'15 min', cue:'Moderate incline, brisk pace.', sets:1, timed:true, seconds:900 }
  ]},
  sat: { label:'Sat · Cardio (Longer)', list:[
    { name:'Brisk Walk / Hike / Cycling', target:'40-45 min', cue:'Comfortable, sustained pace — your longest cardio session of the week.', sets:1, timed:true, seconds:2400 }
  ]},
  sun: { label:'Sun · Rest', list:[
    { name:'Full Rest', target:'—', cue:'No structured training today. Optional light stretching if you feel stiff — otherwise just recover.', sets:1, timed:false }
  ]}
};
const DAY_ORDER = ['mon','tue','wed','thu','fri','sat','sun'];

/* ---------------- STATE (in-memory only, resets on reload) ---------------- */
let dietTab = 'lunch';
let exerciseDay = DAY_ORDER[(new Date().getDay()+6)%7]; // default to today (getDay: 0=Sun..6=Sat)
const setState = {}; // key: "day_exIdx_setIdx" -> bool
let totalSetsLogged = 0;

/* ---------------- MAIN TABS ---------------- */
document.querySelectorAll('.maintab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.maintab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const v = tab.dataset.view;
    document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
    document.getElementById('view-'+v).classList.add('active');
  });
});

/* ---------------- TARGET BANNER ---------------- */
function renderTargetBanner(){
  document.getElementById('targetBanner').innerHTML = `
    <div class="tb-item"><span class="tb-num">${DAILY_TARGET.kcal}</span><span class="tb-lbl">Kcal Target</span></div>
    <div class="tb-item"><span class="tb-num">${DAILY_TARGET.protein}g</span><span class="tb-lbl">Protein</span></div>
    <div class="tb-item"><span class="tb-num">${DAILY_TARGET.carbs}g</span><span class="tb-lbl">Carbs</span></div>
    <div class="tb-item"><span class="tb-num">${DAILY_TARGET.fat}g</span><span class="tb-lbl">Fat</span></div>
  `;
}

/* ---------------- DIET RENDER ---------------- */
function renderSubtabs(){
  const labels = {lunch:'Lunch', snack:'Snack', dinner:'Dinner'};
  document.getElementById('subtabs').innerHTML = Object.keys(labels).map(k=>
    `<div class="subtab ${k===dietTab?'active':''}" data-tab="${k}">${labels[k]}</div>`
  ).join('');
  document.querySelectorAll('.subtab').forEach(el=>{
    el.addEventListener('click', ()=>{ dietTab = el.dataset.tab; renderSubtabs(); renderRecipes(); });
  });
}

function renderRecipes(){
  const list = RECIPES[dietTab];
  document.getElementById('recipeList').innerHTML = list.map((r,i)=>`
    <div class="recipe-card" id="rc-${dietTab}-${i}">
      <div class="recipe-head" onclick="toggleRecipe('${dietTab}',${i})">
        <div>
          <div class="recipe-name">${r.name}</div>
          <div class="recipe-badges">
            <span class="badge kcal">${r.kcal} kcal</span>
            <span class="badge protein">${r.protein}g protein</span>
          </div>
        </div>
        <div class="chev">⌄</div>
      </div>
      <div class="recipe-body">
        <h4>Ingredients</h4>
        <ul>${r.ing.map(x=>`<li>${x}</li>`).join('')}</ul>
        <h4>Method</h4>
        <p>${r.method}</p>
        <div class="macros"><span>Carbs: ${r.carbs}g</span><span>Fat: ${r.fat}g</span></div>
      </div>
    </div>
  `).join('');
}
function toggleRecipe(tab,i){
  document.getElementById(`rc-${tab}-${i}`).classList.toggle('open');
}

/* ---------------- EXERCISE RENDER ---------------- */
function fmtSeconds(s){
  if(s>=60){ const m=Math.floor(s/60), sec=s%60; return m+':'+String(sec).padStart(2,'0'); }
  return s+'s';
}

function renderDaytoggle(){
  document.getElementById('daytoggle').innerHTML = DAY_ORDER.map(d=>{
    const shortLabel = EXERCISES[d].label.split(' · ')[0];
    return `<div class="subtab ${exerciseDay===d?'active':''}" data-day="${d}">${shortLabel}</div>`;
  }).join('');
  document.querySelectorAll('#daytoggle .subtab').forEach(el=>{
    el.addEventListener('click', ()=>{ exerciseDay = el.dataset.day; renderDaytoggle(); renderExercises(); });
  });
}

function renderExercises(){
  const day = EXERCISES[exerciseDay];
  const list = day.list;
  document.getElementById('exerciseHeading').textContent = day.label;
  document.getElementById('exerciseList').innerHTML = list.map((ex,i)=>{
    const circles = Array.from({length:ex.sets}).map((_,s)=>{
      const key = `${exerciseDay}_${i}_${s}`;
      const filled = setState[key];
      return `<div class="set-circle ${filled?'filled':''}" onclick="toggleSet('${exerciseDay}',${i},${s})">${filled?'✓':s+1}</div>`;
    }).join('');
    const doneCount = Array.from({length:ex.sets}).filter((_,s)=>setState[`${exerciseDay}_${i}_${s}`]).length;
    const pct = Math.round((doneCount/ex.sets)*100);
    const timerBtn = ex.timed ? `<button class="timer-btn" id="timerbtn-${exerciseDay}-${i}" onclick="startTimer('${exerciseDay}',${i},${ex.seconds})">Start ${fmtSeconds(ex.seconds)}</button>` : '';
    return `
      <div class="exercise-card">
        <div class="ex-head">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-target">${ex.target}</div>
        </div>
        <div class="ex-cue">${ex.cue}</div>
        <div class="sets-row">${circles}${timerBtn}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');
}

function toggleSet(day,i,s){
  const key = `${day}_${i}_${s}`;
  setState[key] = !setState[key];
  totalSetsLogged += setState[key] ? 1 : -1;
  document.getElementById('setsDone').textContent = totalSetsLogged;
  renderExercises();
}

function resetAllSets(){
  Object.keys(setState).forEach(k=>delete setState[k]);
  totalSetsLogged = 0;
  document.getElementById('setsDone').textContent = 0;
  renderExercises();
}

function startTimer(day,i,seconds){
  const btn = document.getElementById(`timerbtn-${day}-${i}`);
  if(btn.classList.contains('running')) return;
  let remaining = seconds;
  btn.classList.add('running');
  btn.textContent = fmtSeconds(remaining);
  const interval = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      clearInterval(interval);
      btn.classList.remove('running');
      btn.textContent = 'Start '+fmtSeconds(seconds);
      btn.style.background = 'var(--teal)'; btn.style.color = '#08150f';
      setTimeout(()=>{ btn.style.background=''; btn.style.color=''; }, 800);
    } else {
      btn.textContent = fmtSeconds(remaining);
    }
  }, 1000);
}

/* ---------------- THEME ---------------- */
function toggleTheme(){
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = isLight ? '🌙' : '☀️';
}
(function initTheme(){
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
  window.addEventListener('DOMContentLoaded', ()=>{
    document.getElementById('themeBtn').textContent = prefersLight ? '☀️' : '🌙';
  });
})();

/* init */
renderTargetBanner();
renderSubtabs();
renderRecipes();
renderDaytoggle();
renderExercises();
</script>
